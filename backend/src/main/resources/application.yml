spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/immosaas
    username: ${DB_USER:immosaas}
    password: ${DB_PASSWORD:immosaas123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:noreply@immosaas.ma}
    password: ${MAIL_PASSWORD:changeme}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 25MB

app:
  jwt:
    secret: ${JWT_SECRET:immo-saas-secret-key-must-be-at-least-256-bits-long-for-HS256-algorithm}
    expiration: 86400000
    refresh-expiration: 604800000
  enchere:
    duree-jours: 7
  frais-inscription:
    seuil-prix: 500
    montant: 20

server:
  port: 8080

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
