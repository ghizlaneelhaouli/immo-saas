version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    container_name: immosaas_db
    environment:
      POSTGRES_DB: immosaas
      POSTGRES_USER: immosaas
      POSTGRES_PASSWORD: immosaas123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immosaas -d immosaas"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: immosaas_backend
    ports:
      - "8080:8080"
    environment:
      DB_USER: immosaas
      DB_PASSWORD: immosaas123
      JWT_SECRET: immo-saas-secret-key-must-be-at-least-256-bits-long-for-HS256-algorithm
      MAIL_USERNAME: ${MAIL_USERNAME:-noreply@immosaas.ma}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-changeme}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/immosaas
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: immosaas_frontend
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
